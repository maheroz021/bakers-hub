<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Our Menu - Baker's Hub</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  
  <style>
    /* Style for the search bar, specific to this page */
    .menu__search {
      margin: 2rem 0;
    }
    .menu__search input {
      width: 100%;
      max-width: 500px;
      margin: 0 auto;
      display: block;
      box-shadow: var(--shadow-soft);
    }
  </style>
</head>
<body>

  <header class="header">
    <nav class="nav container">
      <a href="index.html" class="nav__logo">
        Baker's <span class="nav__logo-script">Hub</span>
      </a>
      <div class="nav__menu" id="nav-menu">
        <ul class="nav__list">
          <li class="nav__item"><a href="index.html" class="nav__link">Home</a></li>
          <li class="nav__item"><a href="menu.html" class="nav__link active">Menu</a></li>
          <li class="nav__item"><a href="about.html" class="nav__link">About</a></li>
          <li class="nav__item"><a href="testimonials.html" class="nav__link">Reviews</a></li>
          <li class="nav__item"><a href="contact.html" class="nav__link">Contact</a></li>
        </ul>
      </div>
      <div class="nav__icons">
        <div class="cart-icon" id="cart-icon">
          <i class="fas fa-shopping-cart"></i>
          <span class="cart-item-count" id="cart-item-count">0</span>
        </div>
        <i class="fas fa-user"></i>
        <div class="nav__toggle" id="nav-toggle">
          <i class="fas fa-bars"></i>
        </div>
      </div>
    </nav>
  </header>

  <main>
    <section class="menu section container">
      <h1 class="section-title">
        Our <span class="script-font">Menu</span>
      </h1>
      
      <div class="menu__search">
        <input type="search" id="search-bar" placeholder="Search for treats..." class="contact-form-input">
      </div>

      <div class="menu__filters" id="menu-filters">
        <button class="filter-btn active" data-category="all">All</button>
        <button class="filter-btn" data-category="Cakes">Cakes</button>
        <button class="filter-btn" data-category="Pastries">Pastries</button>
        <button class="filter-btn" data-category="Cookies">Cookies</button>
        <button class="filter-btn" data-category="Breakfast">Breakfast</button>
      </div>

      <div class="product__grid" id="product-grid">
        </div>
    </section>
  </main>

  <footer class="footer">
    <div class="container">
      <a href="index.html" class="footer__logo">Baker's Hub</a>
      <p>Baking the world a better place, one pastry at a time.</p>
      <div class="footer__social">
        <a href="#"><i class="fab fa-facebook-f"></i></a>
        <a href="#"><i class="fab fa-instagram"></i></a>
        <a href="#"><i class="fab fa-twitter"></i></a>
      </div>
      <p class="footer__copy">© 2025 Baker's Hub. All rights reserved.</p>
    </div>
  </footer>
  
  <div class="sticky-cart" id="sticky-cart">
    <div class="sticky-cart__header">
      <h3 class="sticky-cart__title">Your Cart</h3>
      <i class="fas fa-times" id="cart-close-btn"></i>
    </div>
    <div class="sticky-cart__items" id="cart-items-container">
      <p>Your cart is empty.</p>
    </div>
    <div class="sticky-cart__footer">
      <div class="sticky-cart__total">
        Total: <span id="cart-total-price">$0.00</span>
      </div>
      <a href="order.html" class="btn btn-checkout">Checkout</a>
    </div>
  </div>

  <script src="js/admin-menu.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
